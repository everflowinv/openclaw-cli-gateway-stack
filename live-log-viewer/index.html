<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLI 网关运行看板</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d1117; color: #c9d1d9; font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; font-size: 13px; height: 100vh; display: flex; flex-direction: column; }
  #header { background: #161b22; border-bottom: 1px solid #30363d; padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  #header h1 { font-size: 14px; font-weight: 600; color: #58a6ff; white-space: nowrap; }
  #tabs { display: flex; gap: 6px; }
  .tab { background: #21262d; border: 1px solid #30363d; color: #8b949e; padding: 3px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-family: inherit; white-space: nowrap; }
  .tab:hover { background: #30363d; color: #c9d1d9; }
  .tab.active { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  .tab .badge { display: inline-block; min-width: 14px; text-align: center; margin-left: 6px; padding: 0 4px; border-radius: 8px; background: #da3633; color: #fff; font-size: 10px; font-weight: 700; }
  .tab.active .badge { background: #fff; color: #1f6feb; }
  #filename { color: #8b949e; font-size: 12px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #status { font-size: 12px; padding: 2px 8px; border-radius: 12px; background: #1a3a1a; color: #3fb950; border: 1px solid #238636; white-space: nowrap; }
  #status.error { background: #3a1a1a; color: #f85149; border-color: #da3633; }
  #controls { display: flex; gap: 8px; }
  button { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; padding: 4px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-family: inherit; }
  button:hover { background: #30363d; }
  button.active { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  #filter-bar { background: #161b22; border-bottom: 1px solid #30363d; padding: 8px 16px; display: flex; gap: 8px; flex-shrink: 0; }
  #filter { flex: 1; background: #0d1117; border: 1px solid #30363d; color: #c9d1d9; padding: 5px 10px; border-radius: 6px; font-family: inherit; font-size: 12px; }
  #filter:focus { outline: none; border-color: #58a6ff; }
  #filter::placeholder { color: #484f58; }
  #session-filter { background: #0d1117; border: 1px solid #30363d; color: #c9d1d9; padding: 5px 8px; border-radius: 6px; font-family: inherit; font-size: 12px; max-width: 220px; }
  #log-root { flex: 1; overflow-y: auto; padding: 8px 0; }
  .log-container { display: none; }
  .log-container.active { display: block; }
  .item { padding: 2px 16px 2px 13px; line-height: 1.6; white-space: pre-wrap; word-break: break-all; border-left: 3px solid transparent; }
  .item:hover { background: #161b22; }
  .item.session-header { color: #e3b341; background: #1c2128; margin-top: 6px; font-weight: 600; }
  .item.meta { color: #8b949e; font-size: 12px; }
  .item.meta.error { color: #f85149; }
  .item.text-block { color: #c9d1d9; }
  .item.thinking-block { color: #8b949e; }
  .thinking-label { cursor: pointer; color: #a371f7; user-select: none; }
  .thinking-label:hover { text-decoration: underline; }
  .thinking-body { display: none; margin-top: 4px; padding: 6px 10px; background: #161b22; border-radius: 6px; color: #8b949e; font-style: italic; }
  .thinking-block.expanded .thinking-body { display: block; }
  .session-chip { display: inline-block; font-size: 10px; padding: 0 6px; border-radius: 8px; margin-right: 8px; vertical-align: 1px; color: #0d1117; font-weight: 700; }
  #stats { background: #161b22; border-top: 1px solid #30363d; padding: 5px 16px; font-size: 11px; color: #8b949e; flex-shrink: 0; display: flex; gap: 16px; }
  .hidden { display: none !important; }
  #overview { padding: 8px 16px; color: #8b949e; }
  #accounting { border-bottom: 1px solid #30363d; flex-shrink: 0; max-height: 40vh; overflow: auto; }
  #accounting > summary { cursor: pointer; padding: 6px 16px; color: #8b949e; }
  .tool-detail summary { cursor: pointer; color: #58a6ff; }
  .tool-detail pre { white-space: pre-wrap; padding: 6px 12px; color: #8b949e; }
  #metrics { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; padding: 12px 16px 8px; flex-shrink: 0; }
  .metric { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 10px 12px; }
  .metric .label { color: #8b949e; font-size: 11px; }
  .metric .value { color: #f0f6fc; font-size: 21px; margin: 5px 0; font-weight: 600; }
  .metric .detail { color: #8b949e; font-size: 10px; min-height: 14px; }
  #source-note { color: #8b949e; padding: 0 16px 8px; font-size: 11px; flex-shrink: 0; }
  #model-summary { display: flex; gap: 8px; padding: 0 16px 10px; flex-wrap: wrap; flex-shrink: 0; }
  #request-accounting { padding: 0 16px 12px; overflow-x: auto; }
  #request-accounting table { border-collapse: collapse; white-space: nowrap; font-size: 11px; }
  #request-accounting th, #request-accounting td { padding: 4px 12px 4px 0; text-align: left; border-bottom: 1px solid #21262d; }
  .model-pill { text-align: left; font-size: 11px; }
  @media(max-width: 850px) { #header { flex-wrap: wrap; } #filename { display: none; } #metrics { grid-template-columns: repeat(2, 1fr); } #filter-bar { flex-wrap: wrap; } }
</style>
</head>
<body>
<div id="header">
  <h1>CLI 网关运行看板</h1>
  <div id="tabs"></div>
  <span id="filename">加载中…</span>
  <span id="status">连接中…</span>
  <div id="controls">
    <button id="btn-follow" class="active" onclick="toggleFollow()">跟随日志</button>
    <button onclick="clearView()">清空视图</button>
    <button onclick="downloadLog()">下载日志</button>
  </div>
</div>
<div id="overview">等待请求…</div>
<details id="accounting"><summary>用量与刊例估价 · 点击展开</summary>
<div id="metrics">
  <div class="metric"><div class="label">已加载请求</div><div class="value" id="metric-requests">0</div><div class="detail">按请求 ID 去重</div></div>
  <div class="metric"><div class="label">运行中 / 失败</div><div class="value" id="metric-running">0 / 0</div><div class="detail" id="metric-success">已完成 0</div></div>
  <div class="metric"><div class="label">已报告 tokens</div><div class="value" id="metric-tokens">—</div><div class="detail" id="metric-cache">缓存为输入子集，不重复相加</div></div>
  <div class="metric"><div class="label">API 刊例估算</div><div class="value" id="metric-cost">—</div><div class="detail" id="metric-cost-detail">美元；不是订阅实付</div></div>
  <div class="metric"><div class="label">用量覆盖</div><div class="value" id="metric-coverage">0 / 0</div><div class="detail" id="metric-background">计数未知不填零</div></div>
</div>
<div id="source-note">汇总当前加载的最近请求，最多 1,000 条；不受文本筛选影响。</div>
<div id="model-summary"></div>
<div id="request-accounting"></div>
</details>
<div id="filter-bar">
  <select id="session-filter" onchange="applyFilter()">
    <option value="">全部请求</option>
  </select>
  <input id="filter" type="text" placeholder="筛选已显示内容（支持正则表达式）" oninput="applyFilter()">
  <button onclick="document.getElementById('filter').value=''; document.getElementById('session-filter').value=''; applyFilter()">重置筛选</button>
</div>
<div id="log-root"></div>
<div id="stats">
  <span id="stat-lines">日志行：0</span>
  <span id="stat-shown">显示：0</span>
  <span id="stat-sessions">请求：0</span>
  <span id="stat-errors">错误：0</span>
  <span id="stat-scroll">位置：底部</span>
</div>

<script>
  const MAX_RAW_LINES = 5000;   // raw log buffer per source (Download)
  const MAX_ITEMS = 2000;       // rendered DOM items per source

  const logRoot = document.getElementById('log-root');
  const statusEl = document.getElementById('status');
  const PALETTE = ['#58a6ff', '#3fb950', '#e3b341', '#f778ba', '#a371f7', '#f0883e', '#39c5cf', '#ff7b72'];

  let sources = [];             // [{id,label,file,el,state...}]
  let active = null;            // active source object

  // ───────── follow logic: only real user input disables it ─────────
  // #log-root is the single scrollable element (per-source containers are
  // plain blocks inside it); all scrollTop math must target logRoot itself.
  let following = true;
  function setFollowing(v) {
    if (following === v) return;
    following = v;
    document.getElementById('btn-follow').classList.toggle('active', v);
  }
  function toggleFollow() {
    setFollowing(!following);
    if (following) logRoot.scrollTop = logRoot.scrollHeight;
  }
  let scrollScheduled = false;
  function scheduleScroll() {
    if (!following || scrollScheduled) return;
    scrollScheduled = true;
    requestAnimationFrame(() => {
      scrollScheduled = false;
      if (following) logRoot.scrollTop = logRoot.scrollHeight;
    });
  }
  logRoot.addEventListener('wheel', (e) => { if (e.deltaY < 0) setFollowing(false); }, { passive: true });
  logRoot.addEventListener('touchmove', () => setFollowing(false), { passive: true });
  window.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    if (['ArrowUp', 'PageUp', 'Home'].includes(e.key)) setFollowing(false);
    if (['End'].includes(e.key)) setFollowing(true);
  });
  // scrolling back to the bottom re-enables follow
  function updateScrollStat() {
    const distance = logRoot.scrollHeight - logRoot.scrollTop - logRoot.clientHeight;
    document.getElementById('stat-scroll').textContent = distance < 30 ? '位置：底部' : `位置：+${Math.round(distance)}px`;
  }
  logRoot.addEventListener('scroll', () => {
    const atBottom = logRoot.scrollHeight - logRoot.scrollTop - logRoot.clientHeight < 30;
    if (atBottom && !following) setFollowing(true);
    updateScrollStat();
  });
  updateScrollStat();

  // ───────── per-source rendering (identical format for every gateway) ─────────
  function newSourceState() {
    return {
      allLines: [],             // raw lines, for Download
      items: [],                // rendered items: {el, session, getText()}
      sessions: new Map(),      // tag8 -> {color, openBlock}
      requests: new Map(),      // one accounting record per gateway request
      tools: new Map(),
      errorCount: 0,
      unseenErrors: 0,
      lastSeq: null,
      lastActivity: Date.now(),
      es: null,
      reconnectTimer: null,
    };
  }

  function getSession(src, tag) {
    const st = src.state;
    if (!st.sessions.has(tag)) {
      const color = PALETTE[st.sessions.size % PALETTE.length];
      st.sessions.set(tag, { color, openBlock: null });
      if (src === active) {
        const opt = document.createElement('option');
        opt.value = tag;
        opt.textContent = tag;
        document.getElementById('session-filter').appendChild(opt);
        updateStats(src);
      }
    }
    return st.sessions.get(tag);
  }

  function chip(tag, color) {
    const c = document.createElement('span');
    c.className = 'session-chip';
    c.style.background = color;
    c.textContent = tag;
    return c;
  }

  function pushItem(src, el, sessionTag, getText) {
    const st = src.state;
    const item = { el, session: sessionTag, getText };
    st.items.push(item);
    if (!itemVisible(st, item)) el.classList.add('hidden');
    src.container.appendChild(el);
    while (st.items.length > MAX_ITEMS) {
      const old = st.items.shift();
      // if a trimmed element is some session's open block, detach it cleanly
      for (const s of st.sessions.values()) {
        if (s.openBlock && s.openBlock.el === old.el) s.openBlock = null;
      }
      old.el.remove();
    }
    if (src === active) { updateShown(src); scheduleScroll(); }
    return item;
  }

  function itemVisible(st, item) {
    if (sessionFilter && item.session !== sessionFilter) return false;
    if (filterRegex && !filterRegex.test(item.getText())) return false;
    return true;
  }

  function updateShown(src) {
    let shown = 0;
    for (const it of src.state.items) if (!it.el.classList.contains('hidden')) shown++;
    if (src === active) document.getElementById('stat-shown').textContent = `显示：${shown}`;
  }

  function refreshItemVisibility(src, item) {
    item.el.classList.toggle('hidden', !itemVisible(src.state, item));
  }

  function closeBlock(sess) { sess.openBlock = null; }

  function appendThinking(src, tag, text) {
    const sess = getSession(src, tag);
    let b = sess.openBlock;
    if (!b || b.kind !== 'thinking') {
      const el = document.createElement('div');
      el.className = 'item thinking-block';
      el.style.borderLeftColor = sess.color;
      el.appendChild(chip(tag, sess.color));
      const label = document.createElement('span');
      label.className = 'thinking-label';
      const body = document.createElement('div');
      body.className = 'thinking-body';
      label.onclick = () => el.classList.toggle('expanded');
      el.appendChild(label);
      el.appendChild(body);
      b = { kind: 'thinking', el, label, body, count: 0, chars: 0, text: '' };
      sess.openBlock = b;
      b.item = pushItem(src, el, tag, () => '[thinking] ' + b.text);
    }
    b.count++;
    b.chars += text.length;
    b.text += text;
    b.body.textContent = b.text;
    b.label.textContent = `▸ 推理 ×${b.count} (${b.chars >= 1000 ? (b.chars / 1000).toFixed(1) + 'k' : b.chars} chars)`;
    refreshItemVisibility(src, b.item);
    if (src === active) scheduleScroll();
  }

  function appendText(src, tag, text) {
    const sess = getSession(src, tag);
    let b = sess.openBlock;
    if (!b || b.kind !== 'text') {
      const el = document.createElement('div');
      el.className = 'item text-block';
      el.style.borderLeftColor = sess.color;
      el.appendChild(chip(tag, sess.color));
      const span = document.createElement('span');
      el.appendChild(span);
      b = { kind: 'text', el, span, text: '' };
      sess.openBlock = b;
      b.item = pushItem(src, el, tag, () => b.text);
    }
    b.text += text;
    b.span.textContent = b.text;
    refreshItemVisibility(src, b.item);
    if (src === active) scheduleScroll();
  }

  function appendHeader(src, tag, text, isErrorish) {
    const sess = getSession(src, tag);
    closeBlock(sess);
    const el = document.createElement('div');
    const isModelLine = /(^| )model=/.test(text);
    el.className = 'item ' + (isModelLine ? 'session-header' : 'meta' + (isErrorish ? ' error' : ''));
    el.style.borderLeftColor = sess.color;
    el.appendChild(chip(tag, sess.color));
    el.appendChild(document.createTextNode(text));
    if (isErrorish) {
      src.state.errorCount++;
      if (src !== active) {
        src.state.unseenErrors++;
        renderTabBadge(src);
      }
      if (src === active) updateStats(src);
    }
    pushItem(src, el, tag, () => text);
  }

  // ───────── log line parsing (shared by all gateways) ─────────
  const PREFIX_RE = /^\[[A-Z0-9]+GW\] /;

  function sumUsage(calls) {
    const u = { prompt_tokens: 0, completion_tokens: 0, total_tokens: 0, prompt_tokens_details: { cached_tokens: 0 }, cache_creation_input_tokens: 0 };
    for (const call of calls) {
      for (const k of ['prompt_tokens', 'completion_tokens', 'total_tokens']) u[k] += call.usage[k] || 0;
      u.prompt_tokens_details.cached_tokens += call.usage.prompt_tokens_details?.cached_tokens || 0;
      u.cache_creation_input_tokens += call.usage.cache_creation_input_tokens || 0;
    }
    return u;
  }
  function trackRequest(src, obj) {
    if (!obj.request || !['start','init','model','usage','done','error','cancel'].includes(obj.event)) return;
    const map = src.state.requests;
    if (!map.has(obj.request)) map.set(obj.request, { model: obj.model || '未记录模型', status: 'unknown', usage: null, cost: null, background: null, calls: new Map(), finalized: false });
    const r = map.get(obj.request);
    if (obj.model && obj.usageScope !== 'model-call' && !obj.messageId) r.model = obj.model;
    if (obj.event === 'start') { r.status = 'running'; r.context = obj.contextWindow; r.bytes = obj.maxPromptBytes; }
    if (obj.event === 'done') r.status = 'done';
    if (obj.event === 'error' || obj.event === 'cancel') r.status = 'error';
    if (Number.isFinite(obj.usage?.total_tokens)) {
      if (obj.event === 'usage' && obj.messageId) {
        r.calls.set(obj.messageId, { usage: obj.usage, cost: obj.estimatedCostUsd, complete: obj.usageComplete === true });
        if (!r.finalized) {
          const calls = [...r.calls.values()];
          r.usage = sumUsage(calls);
          r.cost = calls.every(c => Number.isFinite(c.cost)) ? calls.reduce((n,c) => n+c.cost, 0) : null;
          r.complete = calls.every(c => c.complete);
        }
      } else {
        r.usage = obj.usage;
        r.cost = Number.isFinite(obj.estimatedCostUsd) ? obj.estimatedCostUsd : null;
        r.complete = obj.usageComplete === true || obj.event === 'done';
        r.finalized = ['done', 'error', 'cancel'].includes(obj.event);
      }
    }
    if (obj.backgroundUsage) r.background = obj.backgroundUsage;
    if (obj.coverage) r.coverage = obj.coverage;
    if (obj.usage_reported) r.reported = obj.usage_reported;
    if (obj.costBasis) r.costBasis = obj.costBasis;
    if (obj.usage_raw?.thinking_tokens != null) r.reasoning = obj.usage_raw.thinking_tokens;
    while (map.size > 1000) map.delete(map.keys().next().value);
    if (src === active) renderMetrics(src);
  }
  const readable = value => typeof value === 'string' ? value : value == null ? '' : JSON.stringify(value, null, 2);
  function renderTool(src, tag, obj) {
    const tools = src.state.tools;
    const id = obj.toolUseId || obj.callId || obj.id;
    let key = id ? tag + ':' + id : null;
    if (!key && obj.event !== 'tool') {
      const candidates = [...tools].filter(([k,t]) => t.tag === tag && !t.done && (!obj.name || t.name === obj.name));
      if (candidates.length === 1) key = candidates[0][0];
    }
    key ||= tag + ':anonymous:' + tools.size;
    let t = tools.get(key);
    if (!t || !t.el.isConnected) {
      const sess = getSession(src, tag); closeBlock(sess);
      const el = document.createElement('details'); el.className = 'item tool-detail'; el.style.borderLeftColor = sess.color;
      const summary = document.createElement('summary'); el.appendChild(summary);
      const pre = document.createElement('pre'); el.appendChild(pre);
      t = { el, summary, pre, tag, name: obj.name || '工具', args: '', output: '', done: false };
      t.item = pushItem(src, el, tag, () => t.name + ' ' + t.args + ' ' + t.output);
      tools.set(key,t);
      while (tools.size > MAX_ITEMS) tools.delete(tools.keys().next().value);
    }
    if (obj.name) t.name = obj.name;
    if (obj.event === 'tool_args') t.args += obj.text || '';
    else if (obj.args) t.args = readable(obj.args);
    if (['tool_done','tool_result','tool_error'].includes(obj.event)) {
      t.done = true; t.output = readable(obj.output ?? obj.content ?? obj.error);
      if (obj.event === 'tool_error' && !t.failed) {
        t.failed = true; src.state.errorCount++;
        if (src !== active) { src.state.unseenErrors++; renderTabBadge(src); }
        updateStats(src);
      }
    }
    t.summary.textContent = `${tag} · ${t.failed ? '失败' : t.done ? '完成' : '调用'} · ${t.name}`;
    t.pre.textContent = `参数
${t.args || '未记录'}

结果
${t.output || (t.done ? '未记录正文' : '等待返回…')}`;
    refreshItemVisibility(src,t.item);
    if (src === active) scheduleScroll();
  }
  const number = value => Number(value).toLocaleString('zh-CN');
  function renderMetrics(src) {
    const rows = [...src.state.requests.values()];
    const measured = rows.filter(r => r.usage), priced = rows.filter(r => r.cost !== null);
    const terminal = rows.filter(r => r.status === 'done' || r.status === 'error');
    const sum = (list, fn) => list.reduce((n, r) => n + (fn(r) || 0), 0);
    document.getElementById('overview').textContent = `${rows.length} 个请求 · 运行中 ${rows.filter(r => r.status === 'running').length} · 已完成 ${rows.filter(r => r.status === 'done').length} · 失败/取消 ${rows.filter(r => r.status === 'error').length}`;
    document.getElementById('metric-requests').textContent = number(rows.length);
    document.getElementById('metric-running').textContent = `${rows.filter(r => r.status === 'running').length} / ${rows.filter(r => r.status === 'error').length}`;
    document.getElementById('metric-success').textContent = `已完成 ${rows.filter(r => r.status === 'done').length}`;
    document.getElementById('metric-tokens').textContent = measured.length ? number(sum(measured, r => r.usage.total_tokens)) : '—';
    document.getElementById('metric-cache').textContent = measured.length ? `输入 ${number(sum(measured, r => r.usage.prompt_tokens + (r.usage.prompt_tokens_details?.cache_write_tokens === undefined ? r.usage.cache_creation_input_tokens || 0 : 0)))} · 输出 ${number(sum(measured, r => r.usage.completion_tokens))} · 缓存 ${number(sum(measured, r => r.usage.prompt_tokens_details?.cached_tokens))}` : '尚无已报告用量';
    document.getElementById('metric-cost').textContent = priced.length ? '$' + sum(priced, r => r.cost).toFixed(6) : '—';
    document.getElementById('metric-cost-detail').textContent = `${priced.length} 条请求有估价；${measured.filter(r => !r.complete).length} 条用量尚不完整；不是订阅实付`;
    document.getElementById('metric-coverage').textContent = `${terminal.filter(r => r.usage).length} / ${terminal.length}`;
    const bg = sum(rows, r => r.background?.total_tokens);
    document.getElementById('metric-background').textContent = rows.some(r => r.coverage?.includesBackground) ? `后台已报告 ${number(bg)} tokens（已含在合计）` : '后台用量未单列';
    const isMuse = src.id.includes('muse');
    document.getElementById('source-note').textContent = '汇总当前加载的最近请求，最多 1,000 条；不受文本筛选影响。' + (isMuse ? ' Muse 显示运行正文和工具详情；最终回复通过完成校验后交付。缺少服务端计数的调用不填零。' : ' 未提供价格或用量的请求单独留空。');
    const accounting = document.getElementById('request-accounting'); accounting.replaceChildren();
    const table = document.createElement('table');
    const header = document.createElement('tr');
    for (const label of ['请求','累计输入（含缓存）','缓存读 / 写','累计输出（含推理）','推理子集','上报上下文输入','刊例估价 / 计量状态']) {
      const cell = document.createElement('th'); cell.textContent = label; header.appendChild(cell);
    }
    table.appendChild(header);
    for (const [id,r] of [...src.state.requests].reverse()) {
      const tr = document.createElement('tr'), u = r.usage;
      const write = u?.prompt_tokens_details?.cache_write_tokens ?? u?.cache_creation_input_tokens ?? 0;
      const input = u ? u.prompt_tokens + (u.prompt_tokens_details?.cache_write_tokens === undefined ? write : 0) : null;
      const values = [id, input == null ? '—' : number(input), u ? `${number(u.prompt_tokens_details?.cached_tokens || 0)} / ${number(write)}` : '—', u ? number(u.completion_tokens) : '—', r.reasoning ?? u?.completion_tokens_details?.reasoning_tokens ?? '—', r.reported ? number(r.reported.prompt_tokens) : '—', `${r.cost == null ? '未定价' : '$'+r.cost.toFixed(6)} · ${u ? r.complete ? '已报告' : '部分 / 下限' : '未知'}`];
      for (const value of values) { const cell = document.createElement('td'); cell.textContent = value; tr.appendChild(cell); }
      tr.title = r.costBasis || '价格为参考估算；上报上下文输入与跨工具轮次累计输入口径不同。';
      table.appendChild(tr);
    }
    accounting.appendChild(table);
    const models = new Map();
    for (const r of rows) {
      if (!models.has(r.model)) models.set(r.model, { count: 0, tokens: 0, context: r.context, bytes: r.bytes });
      const m = models.get(r.model); m.count++; m.tokens += r.usage?.total_tokens || 0;
      m.context ||= r.context; m.bytes ||= r.bytes;
    }
    const target = document.getElementById('model-summary'); target.replaceChildren();
    for (const [name, m] of models) {
      const button = document.createElement('button'); button.className = 'model-pill';
      button.textContent = `${name} · ${m.count} 次 · ${number(m.tokens)} 已报告 tokens${m.context ? ` · context ${number(m.context)}` : ''}${name.includes('contributor') ? ' · 输入/输出可用于训练' : ''}`;
      button.onclick = () => { document.getElementById('filter').value = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); applyFilter(); };
      target.appendChild(button);
    }
  }

  function processLine(src, raw) {
    if (raw == null || raw === '') return;
    const st = src.state;
    st.allLines.push(raw);
    if (st.allLines.length > MAX_RAW_LINES) st.allLines.shift();
    if (src === active) document.getElementById('stat-lines').textContent = `日志行：${st.allLines.length}`;

    if (!PREFIX_RE.test(raw)) return;
    let obj;
    try { obj = JSON.parse(raw.replace(PREFIX_RE, '')); }
    catch (e) { return; }
    if (!obj || !obj.event) return;
    trackRequest(src, obj);

    const tag = obj.request || '(gateway)';
    if (obj.event === 'thinking' && typeof obj.text === 'string') {
      appendThinking(src, tag, obj.text);
    } else if (obj.event === 'text' && typeof obj.text === 'string') {
      appendText(src, tag, obj.text);
    } else if (obj.event === 'final' && typeof obj.text === 'string') {
      appendHeader(src, tag, '已验证最终回复', false);
      appendText(src, tag, obj.text);
    } else if (obj.event === 'diagnostic_warning') {
      appendHeader(src, tag, `日志详情读取失败: ${obj.message || 'unknown'}`, true);
    } else if (obj.event === 'block_stop') {
      if (st.sessions.has(tag)) closeBlock(st.sessions.get(tag));
    } else if (obj.event === 'start') {
      const session = obj.session ? ` session=${obj.session}` : '';
      const effort = obj.effort ? ` effort=${obj.effort}` : '';
      const images = (obj.images ?? obj.imageCount) != null ? ` images=${obj.images ?? obj.imageCount}` : '';
      appendHeader(src, tag, `model=${obj.model}${effort} stream=${Boolean(obj.stream)}${images}${session}`, false);
    } else if (obj.event === 'init') {
      const init = [];
      if (obj.permissionMode) init.push(`permissions=${obj.permissionMode}`);
      if (obj.toolCount != null) init.push(`tools=${obj.toolCount}`);
      appendHeader(src, tag, `init${init.length ? ' ' + init.join(' ') : ''}`, false);
    } else if (obj.event === 'model') {
      appendHeader(src, tag, `已确认模型 ${obj.model}${obj.sessionId ? ' · CLI 会话 ' + obj.sessionId : ''}`, false);
    } else if (['tool','tool_args','tool_done','tool_error','tool_result'].includes(obj.event)) {
      renderTool(src,tag,obj);
    } else if (obj.event === 'usage') {
      if (obj.inputIntegrity?.verified === false) appendHeader(src, tag, '输入完整性未通过；不会把截短后的回答当作成功结果', true);
    } else if (obj.event === 'done') {
      appendHeader(src, tag, `完成 · ${formatDuration(obj.durationMs)}`, false);
    } else if (obj.event === 'error') {
      appendHeader(src, tag, `error${obj.code ? ` code=${obj.code}` : ''}: ${obj.message || 'unknown error'}`, true);
    } else if (obj.event === 'cancel') {
      appendHeader(src, tag, `cancelled duration=${formatDuration(obj.durationMs)}`, false);
    }
  }

  function formatDuration(ms) {
    if (!Number.isFinite(ms)) return '?';
    if (ms < 1000) return `${ms}ms`;
    return `${(ms / 1000).toFixed(1)}s`;
  }

  // ───────── tabs / stats / controls ─────────
  let filterRegex = null;
  let sessionFilter = '';

  function renderTabBadge(src) {
    const badge = src.tabEl.querySelector('.badge');
    if (src.state.unseenErrors > 0) {
      badge.textContent = src.state.unseenErrors;
      badge.style.display = 'inline-block';
    } else {
      badge.style.display = 'none';
    }
  }

  function switchTab(src) {
    if (src === active) return;
    active = src;
    for (const s of sources) {
      s.tabEl.classList.toggle('active', s === src);
      s.container.classList.toggle('active', s === src);
    }
    src.state.unseenErrors = 0;
    history.replaceState(null, '', '#' + encodeURIComponent(src.id));
    renderTabBadge(src);
    document.getElementById('filename').textContent = src.file || '';
    // session dropdown is per-source: rebuild from this source's sessions
    const requestSelect = document.getElementById('session-filter');
    requestSelect.innerHTML = '<option value="">全部请求</option>';
    for (const tag of src.state.sessions.keys()) {
      const opt = document.createElement('option');
      opt.value = tag;
      opt.textContent = tag;
      requestSelect.appendChild(opt);
    }
    requestSelect.value = '';
    sessionFilter = '';
    updateStats(src);
    renderMetrics(src);
    for (const it of src.state.items) it.el.classList.toggle('hidden', !itemVisible(src.state, it));
    updateShown(src);
    if (following) logRoot.scrollTop = logRoot.scrollHeight;
  }

  function updateStats(src) {
    if (src !== active) return;
    document.getElementById('stat-lines').textContent = `日志行：${src.state.allLines.length}`;
    document.getElementById('stat-sessions').textContent = `请求：${src.state.sessions.size}`;
    document.getElementById('stat-errors').textContent = `错误：${src.state.errorCount}`;
    updateShown(src);
  }

  function applyFilter() {
    if (!active) return;
    const val = document.getElementById('filter').value.trim();
    try { filterRegex = val ? new RegExp(val, 'i') : null; }
    catch (e) { filterRegex = null; }
    sessionFilter = document.getElementById('session-filter').value;
    for (const it of active.state.items) it.el.classList.toggle('hidden', !itemVisible(active.state, it));
    updateShown(active);
    scheduleScroll();
  }

  function clearView() {
    if (!active) return;
    const st = active.state;
    st.allLines = [];
    st.items = [];
    st.errorCount = 0;
    st.unseenErrors = 0;
    active.container.innerHTML = '';
    st.sessions.clear();
    st.requests.clear();
    st.tools.clear();
    renderMetrics(active);
    renderTabBadge(active);
    const requestSelect = document.getElementById('session-filter');
    requestSelect.innerHTML = '<option value="">全部请求</option>';
    requestSelect.value = '';
    sessionFilter = '';
    document.getElementById('stat-lines').textContent = '日志行：0';
    document.getElementById('stat-shown').textContent = '显示：0';
    document.getElementById('stat-sessions').textContent = '请求：0';
    document.getElementById('stat-errors').textContent = '错误：0';
  }

  function downloadLog() {
    if (!active) return;
    const blob = new Blob([active.state.allLines.join('\n')], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${active.id}-live.log`;
    a.click();
  }

  // ───────── connections (one SSE per source, all live simultaneously) ─────────
  // Backlog comes through the stream itself (server replays history on
  // connect; ?since=<seq> resumes without gaps or duplicates). A watchdog
  // forces a reconnect when neither data nor a server ping (every 10s)
  // arrives — an open-but-dead SSE socket must never require a manual refresh.
  function connect(src) {
    const st = src.state;
    if (st.reconnectTimer) { clearTimeout(st.reconnectTimer); st.reconnectTimer = null; }
    if (st.es) st.es.close();
    st.lastActivity = Date.now();
    if (src === active) {
      statusEl.textContent = '连接中…';
      statusEl.className = '';
    }

    const since = st.lastSeq != null ? `&since=${st.lastSeq}` : '';
    st.es = new EventSource(`/stream?source=${encodeURIComponent(src.id)}${since}`);
    st.es.onopen = () => {
      st.lastActivity = Date.now();
      if (src === active) { statusEl.textContent = '● 实时连接'; statusEl.className = ''; }
    };
    st.es.onmessage = (e) => {
      st.lastActivity = Date.now();
      if (e.lastEventId) st.lastSeq = parseInt(e.lastEventId, 10);
      if (e.data) processLine(src, e.data);
    };
    st.es.addEventListener('ping', () => { st.lastActivity = Date.now(); });
    st.es.addEventListener('meta', (e) => {
      st.lastActivity = Date.now();
      try {
        const meta = JSON.parse(e.data);
        if (meta.file && !src.file) src.file = meta.file;
        if (src === active) document.getElementById('filename').textContent = meta.file || src.file || '';
      } catch (err) {}
    });
    st.es.onerror = () => {
      if (src === active) {
        statusEl.textContent = '● 已断开';
        statusEl.className = 'error';
      }
      st.es.close();
      st.reconnectTimer = setTimeout(() => connect(src), 3000);
    };
  }

  setInterval(() => {
    for (const src of sources) {
      if (Date.now() - src.state.lastActivity > 30000) {
        if (src === active) {
          statusEl.textContent = '● 正在重新连接…';
          statusEl.className = 'error';
        }
        connect(src);
      }
    }
  }, 5000);

  // ───────── boot: fetch sources, build tabs + containers, connect all ─────────
  fetch('/sources').then((r) => r.json()).then((list) => {
    const tabs = document.getElementById('tabs');
    for (const info of list) {
      const src = {
        id: info.id,
        label: info.label,
        file: info.file,
        state: newSourceState(),
        container: null,
        tabEl: null,
      };

      const tab = document.createElement('button');
      tab.className = 'tab';
      tab.textContent = info.label;
      const badge = document.createElement('span');
      badge.className = 'badge';
      badge.style.display = 'none';
      tab.appendChild(badge);
      tab.onclick = () => switchTab(src);
      tabs.appendChild(tab);
      src.tabEl = tab;

      const container = document.createElement('div');
      container.className = 'log-container';
      logRoot.appendChild(container);
      src.container = container;

      sources.push(src);
      connect(src);
    }
    if (sources.length) switchTab(sources.find(s => s.id === decodeURIComponent(location.hash.slice(1))) || sources[0]);
  }).catch(() => {
    statusEl.textContent = '● 日志来源加载失败';
    statusEl.className = 'error';
  });
</script>
</body>
</html>
